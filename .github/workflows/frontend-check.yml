name: Frontend Check

on:
  push:
    branches:
      - fe-dev
      - develop
  pull_request:
    paths:
      - "fe/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
